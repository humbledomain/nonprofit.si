<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- static logo reduction: two concentric shells + n=6 spokes. Opaque, legible at 16px. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0C1620"/>
      <stop offset="1" stop-color="#07090C"/>
    </linearGradient>
    <radialGradient id="bloom" cx="0.32" cy="0.24" r="0.85">
      <stop offset="0" stop-color="#12A98D" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#12A98D" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#bloom)"/>

  <g fill="none" stroke="#64E3C8" stroke-linecap="round">
    <g stroke-width="9" opacity="0.32">
      <path d="M256 96V416"/>
      <path d="M117.5 176L394.5 336"/>
      <path d="M117.5 336L394.5 176"/>
    </g>
    <circle cx="256" cy="256" r="150" stroke-width="24"/>
    <circle cx="256" cy="256" r="60" stroke-width="24"/>
  </g>
</svg>
